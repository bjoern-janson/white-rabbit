name: authority-propagation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-propagation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current authority surfaces
        run: python tools/validate_authority_propagation.py
      - name: Run repository-integrity tests
        run: |
          python -m unittest             tests.test_authority_propagation             tests.test_g7_analyze_robustness_v012
